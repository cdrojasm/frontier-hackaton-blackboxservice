server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = / {
    return 302 /app/;
  }

  location = /app {
    return 301 /app/;
  }

  location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Resolve the private API lazily. Using a variable prevents nginx from
  # resolving the hostname during startup, so /health stays independent.
  resolver __RAILWAY_DNS_SERVER__ valid=10s ipv6=off;
  # Railway injects PORT=8080 into the API service. Keep the API private;
  # app is the only public entrypoint.
  set $api_upstream http://api.railway.internal:8080;

  # Public mimic entrypoint: /mimic/<slug>/* is the base URL of each replacement.
  location /mimic/ {
    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    # CSV imports are converted to a JSON batch by the frontend before reaching
    # the API. Keep enough room for payloads and expected responses.
    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

}

